<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 547" width="752" height="547" fill="none">
  <!-- Otome Hero Graphic Placeholder (752 x 547) - Replace with your custom SVG -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3A6E" />
      <stop offset="50%" stop-color="#455A9F" />
      <stop offset="100%" stop-color="#7B5B9E" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5D8F" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#140E28" flood-opacity="0.45" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas Container with Rounded Edges & Glass Border -->
  <rect x="8" y="8" width="736" height="531" rx="28" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="736" height="531" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Diagonal Aesthetic Lines & Stars -->
  <g opacity="0.25" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 8">
    <line x1="40" y1="40" x2="712" y2="507" />
    <line x1="712" y1="40" x2="40" y2="507" />
  </g>

  <!-- Floating Sparkles & Hearts -->
  <g fill="#FF85A2" opacity="0.85">
    <path d="M120 110 C120 100 135 90 145 105 C155 90 170 100 170 110 C170 125 145 140 145 140 C145 140 120 125 120 110 Z" />
    <path d="M620 420 C620 412 632 404 640 416 C648 404 660 412 660 420 C660 432 640 444 640 444 C640 444 620 432 620 420 Z" transform="scale(0.8) translate(150, 80)" />
    <path d="M590 130 C590 122 602 114 610 126 C618 114 630 122 630 130 C630 142 610 154 610 154 C610 154 590 142 590 130 Z" />
  </g>

  <!-- Twinkle Stars -->
  <g fill="#FFF" opacity="0.9">
    <path d="M220 80 Q225 95 240 100 Q225 105 220 120 Q220 105 205 100 Q220 95 220 80 Z" />
    <path d="M530 90 Q534 102 546 106 Q534 110 530 122 Q526 110 514 106 Q526 102 530 90 Z" />
    <path d="M160 440 Q163 450 173 453 Q163 456 160 466 Q157 456 147 453 Q157 450 160 440 Z" />
    <path d="M600 360 Q604 372 616 376 Q604 380 600 392 Q596 380 584 376 Q596 372 600 360 Z" />
  </g>

  <!-- Central Character Trio Silhouette / Emblem Area -->
  <g filter="url(#shadowFilter)">
    <!-- Center Avatar Circle 1 (Ado) -->
    <g transform="translate(236, 150)">
      <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,0.15)" stroke="#38BDF8" stroke-width="3" />
      <circle cx="60" cy="60" r="48" fill="#3B82F6" opacity="0.8" />
      <text x="60" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">👓</text>
      <text x="60" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#E0F2FE" font-weight="bold" text-anchor="middle">Ado</text>
    </g>

    <!-- Center Avatar Circle 2 (Main Focus - Kou) -->
    <g transform="translate(316, 120)">
      <circle cx="60" cy="60" r="62" fill="rgba(255,255,255,0.25)" stroke="#FF85A2" stroke-width="4" />
      <circle cx="60" cy="60" r="54" fill="#EC4899" opacity="0.85" />
      <text x="60" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">✨</text>
      <text x="60" y="83" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#FCE7F3" font-weight="bold" text-anchor="middle">Kou</text>
    </g>

    <!-- Center Avatar Circle 3 (Ren) -->
    <g transform="translate(416, 150)">
      <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,0.15)" stroke="#A78BFA" stroke-width="3" />
      <circle cx="60" cy="60" r="48" fill="#8B5CF6" opacity="0.8" />
      <text x="60" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">😏</text>
      <text x="60" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#EDE9FE" font-weight="bold" text-anchor="middle">Ren</text>
    </g>
  </g>

  <!-- Title Badge inside graphic -->
  <g transform="translate(376, 320)">
    <rect x="-180" y="0" width="360" height="46" rx="23" fill="rgba(20, 15, 38, 0.65)" stroke="url(#glowGrad)" stroke-width="2" />
    <text x="0" y="29" font-family="'Segoe UI', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">
      MY LOVE LANGUAGE
    </text>
  </g>

  <!-- Dimensions Tag / Placeholder Spec Note -->
  <g transform="translate(376, 395)">
    <rect x="-140" y="0" width="280" height="32" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <text x="0" y="21" font-family="monospace, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      [ SVG Placeholder: 752 × 547 ]
    </text>
  </g>

  <!-- Inner border corner flourishes -->
  <path d="M30 60 L30 30 L60 30" stroke="#FF85A2" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M722 60 L722 30 L692 30" stroke="#FF85A2" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M30 487 L30 517 L60 517" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M722 487 L722 517 L692 517" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>
